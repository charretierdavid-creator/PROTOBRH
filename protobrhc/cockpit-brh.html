<script>
/* ============================================================================
   Application du cockpit (JavaScript sans dépendance)
   ============================================================================ */
(function(){
'use strict';
var API = 'lm-api.php';
var ST = { user:null, csrf:'', ref:null, cr:[], vue:'file', f:{ vue:'actifs' }, liste:[], kpi:{}, sel:null, fiche:null, onglet:'dossier', param:'cr', persp:'', menu:false, demo:false };

/* ---------- utilitaires ---------- */
function hist(h){ try { history.replaceState(null, '', h || (location.pathname + location.search)); } catch (e) {} }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function dt(s, h){ if (!s) return '—'; var d = new Date(String(s).replace(' ', 'T')); if (isNaN(d)) return esc(s);
  var t = d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' }); return h === false ? t : t + ', ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }).replace(':', ' h '); }
function eur(n){ return n == null ? '—' : Math.round(n).toLocaleString('fr-FR').replace(/[  ]/g, ' ') + ' €'; }
function lib(tab, k){ return (ST.ref && ST.ref[tab] && ST.ref[tab][k] != null) ? (typeof ST.ref[tab][k] === 'object' ? ST.ref[tab][k].lib : ST.ref[tab][k]) : (k || '—'); }
function nv(k){ return lib('niveaux', k); }
function toast(m){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2800); }
function api(a, params, body){
  if (window.LM_DEMO) return window.LM_DEMO.api(a, params || {}, body || null);
  var qs = new URLSearchParams(Object.assign({ a:a }, params || {})).toString();
  var o = { method: body ? 'POST' : 'GET', credentials:'same-origin', headers:{ 'Accept':'application/json' } };
  if (body) { o.headers['Content-Type'] = 'application/json'; o.headers['X-LM-CSRF'] = ST.csrf || ''; o.body = JSON.stringify(body); }
  return fetch(API + '?' + qs, o).then(function(r){
    return r.json().catch(function(){ return { ok:false, error:'Réponse illisible du serveur (' + r.status + ').' }; }).then(function(j){
      if (r.status === 401 && a !== 'connexion' && a !== 'moi') { ST.user = null; render(); }
      return j; });
  }).catch(function(){ return { ok:false, error:'Serveur injoignable.' }; });
}
var ROLE = function(){ return ST.user ? ST.user.role : ''; };
var NAT = function(){ return ROLE() === 'national'; };
var FIL = function(){ return ROLE() === 'filiale'; };
var COUL = { caa:'var(--caa)', amundi:'var(--amundi)', worklife:'var(--worklife)' };

/* ---------- démarrage ---------- */
function boot(){
  api('moi').then(function(j){
    if (!j || !j.ok) { app.innerHTML = '<main><div class="wrap"><div class="card pad"><h1>Cockpit BRH</h1><p class="err">' + esc((j && j.error) || 'Service indisponible.') + '</p></div></div></main>'; return; }
    if (!j.connecte) { ST.user = null; ST.configure = j.configure; return render(); }
    ST.user = j.user; ST.csrf = j.csrf; ST.ref = j.ref; ST.cr = j.cr || []; ST.envoi = j.envoi; ST.redir = j.redirection; ST.scenarioB = j.scenario_b;
    var m = location.hash.match(/d=(\d+)/); if (m) ST.sel = +m[1];
    var v = location.hash.match(/v=(\w+)/) || (window.LM_VUE ? [0, window.LM_VUE] : null); if (v) ST.vue = v[1];
    charger();
  });
}
function charger(){
  if (ST.vue === 'file') return chargerFile();
  render();
  if (ST.vue === 'tableau') return api('stats', { du:ST.du || '', au:ST.au || '' }).then(function(j){ ST.stats = j; render(); });
  if (ST.vue === 'distribution') return api('distribution').then(function(j){ ST.distrib = j; render(); });
  if (ST.vue === 'emails') return api('emails').then(function(j){ ST.emails = j; render(); });
  if (ST.vue === 'param') return chargerParam();
}
function filtres(){
  var p = {}; Object.keys(ST.f).forEach(function(k){ if (ST.f[k] !== '' && ST.f[k] != null) p[k] = ST.f[k]; });
  if (NAT() && ST.persp) { var x = ST.persp.split(':'); if (x[0] === 'cr') p.cr = x[1]; }
  return p;
}
function chargerFile(){
  return api('dossiers', filtres()).then(function(j){
    if (!j.ok) { toast(j.error || 'Erreur'); return; }
    ST.liste = j.dossiers; ST.kpi = j.kpi;
    if (NAT() && ST.persp && ST.persp.indexOf('fil:') === 0) { var f = ST.persp.slice(4); ST.liste = ST.liste.filter(function(d){ return d.volets && d.volets[f]; }); }
    if (!ST.sel && ST.liste.length) ST.sel = ST.liste[0].id;
    render();
    if (ST.sel) chargerFiche(ST.sel);
  });
}
function chargerFiche(id){
  ST.sel = id; hist('#d=' + id);
  return api('dossier', { id:id }).then(function(j){ if (j.ok) { ST.fiche = j; } else { ST.fiche = null; toast(j.error); } renderFiche(); marquerSel(); });
}
function chargerParam(){
  var a = { cr:'cr', users:'users', clients:'clients' }[ST.param];
  if (!a) return render();
  return api(a).then(function(j){ ST['p_' + ST.param] = j; render(); });
}

/* ---------- rendu général ---------- */
function render(){
  if (!ST.user) return renderLogin();
  var k = ST.kpi || {};
  var vues = [['file', FIL() ? 'Mes volets' : 'File des dossiers', (k.retard || 0)]];
  if (NAT()) vues.push(['tableau', 'Tableau de bord'], ['distribution', 'Distribution'], ['emails', 'E-mails'], ['param', 'Paramétrage']);
  var u = ST.user, roleLib = u.role === 'expert' ? 'Expert BRH · ' + (crNom(u.cr_code) || '') : (u.role === 'filiale' ? (ST.ref.filiales[u.filiale] || {}).lib : 'Console nationale');
  var bandes = '';
  if (ST.demo) bandes += '<div class="band demo"><div class="wrap">Mode démonstration : données fictives en mémoire, aucun e-mail envoyé. Les règles de gestion sont celles du serveur.</div></div>';
  else if (!ST.envoi) bandes += '<div class="band"><div class="wrap">E-mails générés et journalisés, envoi désactivé (LM_EMAIL_ENVOI dans config.php).' + (ST.redir ? ' Redirection de test active.' : '') + '</div></div>';
  app.innerHTML = '<header class="pbar"><div class="wrap"><b>PORTAIL BRH <i>15C</i></b><span class="s">Cockpit BRH · lead management, version C</span>' +
    '<div class="who"><span><b>' + esc(u.nom) + '</b> <span class="r">· ' + esc(roleLib) + '</span></span><button type="button" id="sortir">Se déconnecter</button></div></div></header>' +
    '<nav class="tabs" aria-label="Vues"><div class="wrap" role="tablist">' + vues.map(function(v){ return '<button type="button" role="tab" data-vue="' + v[0] + '" aria-selected="' + (ST.vue === v[0]) + '">' + v[1] + (v[2] ? '<span class="n" title="dossiers en retard">' + v[2] + '</span>' : '') + '</button>'; }).join('') + '</div></nav>' + bandes +
    '<main id="main"><div class="wrap">' + ({ file:vueFile, tableau:vueTableau, distribution:vueDistribution, emails:vueEmails, param:vueParam }[ST.vue] || vueFile)() + '</div></main>';
  lier();
  if (ST.vue === 'file') { renderFiche(); }
}
function perspective(){
  if (!NAT()) return '';
  return '<label class="persp">Voir comme <select id="persp"><option value="">Console nationale (tout)</option><optgroup label="Expert BRH (CR)">' +
    ST.cr.map(function(c){ return '<option value="cr:' + esc(c.code) + '"' + (ST.persp === 'cr:' + c.code ? ' selected' : '') + '>' + esc(c.nom) + '</option>'; }).join('') +
    '</optgroup><optgroup label="Filiales">' + Object.keys(ST.ref.filiales).map(function(f){ return '<option value="fil:' + f + '"' + (ST.persp === 'fil:' + f ? ' selected' : '') + '>' + esc(ST.ref.filiales[f].lib) + '</option>'; }).join('') + '</optgroup></select></label>';
}
function crNom(code){ for (var i = 0; i < ST.cr.length; i++) if (ST.cr[i].code === code) return ST.cr[i].nom; return code || ''; }

/* ---------- connexion ---------- */
function renderLogin(){
  var demo = ST.demo ? '<div class="quick"><p class="note" style="margin:0">Démonstration : choisissez un profil.</p>' +
    [['national', 'Console nationale (équipe projet)'], ['tp.expert', 'J. Marchand — experte BRH, Touraine Poitou'], ['av.expert', 'L. Garnier — expert BRH, Atlantique Vendée'],
     ['caa.prevoyance', 'CA Assurances — Prévis'], ['amundi.universels', 'Amundi / CA Titres — Universels'], ['worklife', 'Worklife']].map(function(x){
      return '<button type="button" class="btn" data-demo="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>' : '';
  app.innerHTML = '<header class="pbar"><div class="wrap"><b>PORTAIL BRH <i>15C</i></b><span class="s">Cockpit BRH · lead management, version C</span></div></header><main><div class="card login"><h1>Cockpit BRH</h1><p class="lede">Lead management du portail Banque des RH : file des dossiers par niveau de lead, routage vers la Caisse régionale, suivi des volets filiales.</p>' +
    (ST.configure === false && !ST.demo ? '<p class="err">Accès non configuré : ajoutez <code>LM_ADMIN_LOGIN</code> et <code>LM_ADMIN_PASSWORD</code> (10 caractères au moins) dans config.php, ou les identifiants de l’administration (ADMIN_LOGIN / ADMIN_PASSWORD).</p>' : '') +
    '<form class="fm" id="flog"><label>Identifiant<input name="login" autocomplete="username" required></label><label>Mot de passe<input name="mdp" type="password" autocomplete="current-password" required></label>' +
    '<p class="err" id="lerr"></p><button class="btn p" type="submit">Se connecter</button></form>' + demo +
    '<p class="note" style="margin-top:14px">Accès réservé : experts BRH des Caisses régionales, filiales et équipe projet. Données personnelles des dirigeants (RGPD), conservées 12 mois.</p></div></main>';
  var f = document.getElementById('flog');
  f.onsubmit = function(e){ e.preventDefault(); api('connexion', {}, { login:f.login.value, mdp:f.mdp.value }).then(function(j){ if (!j.ok) { document.getElementById('lerr').textContent = j.error; return; } boot(); }); };
  [].forEach.call(document.querySelectorAll('[data-demo]'), function(b){ b.onclick = function(){ api('connexion', {}, { login:b.getAttribute('data-demo'), mdp:'demo' }).then(function(){ boot(); }); }; });
}

/* ============================== FILE DES DOSSIERS ============================== */
function vueFile(){
  var k = ST.kpi || {}, f = ST.f;
  var cartes = [
    ['ultra', 'niveau', 'ultra_chaud', k.ultra_chaud, 'ultra-chauds', 'rappel sous 24 h'],
    ['chaud', 'niveau', 'chaud', k.chaud, 'chauds', 'contact sous 48 h'],
    ['aband', 'niveau', 'abandonniste', k.abandonniste, 'abandonnistes', 'relance J+1 / J+7'],
    ['retard', 'sla', 'retard', k.retard, 'en retard', 'délai cible dépassé']
  ];
  if (NAT()) cartes.push(['', 'statut', 'depose', k.a_attribuer, 'à attribuer', 'sans expert désigné']);
  cartes.push(['', '', '', k.volets_proposition, 'volets', 'en proposition'], ['', '', '', k.volets_signes, 'volets', 'signés']);
  var kp = '<div class="kp">' + cartes.map(function(c){
    var on = c[1] && f[c[1]] === c[2];
    return '<button type="button" class="k ' + c[0] + '"' + (c[1] ? ' data-kf="' + c[1] + ':' + c[2] + '"' : ' disabled') + ' aria-pressed="' + !!on + '"><b>' + (c[3] || 0) + '</b>' + c[4] + '<br>' + c[5] + '</button>';
  }).join('') + '</div>';

  var fl = '<div class="filters"><input type="search" id="fq" placeholder="Entreprise, référence, SIRET, ville…" value="' + esc(f.q || '') + '">' +
    '<select data-f="niveau">' + opt('niveaux', f.niveau, 'Tous niveaux') + '</select><select data-f="statut">' + opt('statuts', f.statut, 'Tous statuts') + '</select>' +
    '<select data-f="client_statut">' + opt('client', f.client_statut, 'Statut client') + '</select>' +
    (NAT() && !ST.persp ? '<select data-f="cr"><option value="">Toutes les CR</option><option value="_aucune"' + (f.cr === '_aucune' ? ' selected' : '') + '>File nationale (à attribuer)</option>' + ST.cr.map(function(c){ return '<option value="' + esc(c.code) + '"' + (f.cr === c.code ? ' selected' : '') + '>' + esc(c.nom) + '</option>'; }).join('') + '</select>' : '') +
    '<span class="seg">' + [['actifs', 'En cours'], ['clotures', 'Clôturés'], ['tous', 'Tous']].map(function(x){ return '<button type="button" data-vf="' + x[0] + '" aria-pressed="' + (f.vue === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</span>' +
    (ROLE() === 'expert' ? '<label class="note"><input type="checkbox" id="fmoi"' + (f.moi ? ' checked' : '') + '> Mes dossiers</label>' : '') +
    (Object.keys(f).some(function(x){ return x !== 'vue' && f[x]; }) ? '<button type="button" class="btn s" id="freset">Effacer les filtres</button>' : '') +
    (NAT() ? '<a class="btn s" style="margin-left:auto;text-decoration:none" href="' + (ST.demo ? '#' : API + '?a=export') + '" id="fexport">Exporter (CSV)</a>' : '') + '</div>';
  var rows = ST.liste.map(function(d){
    return '<tr data-id="' + d.id + '" aria-selected="' + (d.id === ST.sel) + '"><td class="nm"><b>' + esc(d.raison_sociale || d.contact || 'Entreprise non renseignée') + '</b><small>' + esc(d.reference) + (d.effectif ? ' · ' + d.effectif + ' sal.' : '') + (d.ville ? ' · ' + esc(d.ville) : '') + '</small></td>' +
      '<td>' + solChips(d) + '</td>' +
      '<td><span class="bd lv ' + d.niveau + '">' + esc(nv(d.niveau)) + '</span>' + (d.rappel ? '<span class="sm">rappel demandé</span>' : '') + '</td>' +
      '<td><span class="cl ' + d.client_statut + '">' + esc(lib('client', d.client_statut)) + '</span>' + (NAT() ? '<br><small class="note">' + esc(d.cr_nom || 'File nationale') + '</small>' : (d.expert ? '<br><small class="note">' + esc(d.expert) + '</small>' : '')) + '</td>' +
      '<td><span class="bd ' + d.statut + (d.issue && d.issue !== 'signe' ? ' ko' : '') + '">' + esc(d.statut === 'cloture' && d.issue ? lib('issues', d.issue) : lib('statuts', d.statut)) + '</span>' + mini(d.statut) + (d.rdv_le && d.statut !== 'cloture' ? '<span class="sm">RDV ' + dt(d.rdv_le) + '</span>' : '') + '</td>' +
      '<td><span class="sla ' + d.sla.etat + '">' + esc(d.sla.lib) + '</span></td></tr>';
  }).join('');
  var titre = FIL() ? 'Volets ' + esc((ST.ref.filiales[ST.user.filiale] || {}).lib) : (ROLE() === 'expert' ? 'Cockpit de l’expert BRH' : 'File des dossiers');
  return '<h1>' + titre + '</h1><p class="lede">' +

    '<div class="cx"><div class="ctop"><b>Cockpit BRH</b>' + perspective() + '<span class="who">' + ST.liste.length + ' dossier' + (ST.liste.length > 1 ? 's' : '') + ' · ' + esc(ST.user.nom) + '</span></div>' + kp + fl +
    '<div class="grid"><div class="ls"><table class="tbl"><thead><tr><th>Dossier</th><th>Solutions</th><th>Niveau</th><th>Client</th><th>Statut</th><th>Échéance</th></tr></thead><tbody>' +

}
/* solutions du dossier : une pastille discrète par filiale (comme la console de la maquette Parcours dirigeant) */
function solChips(d){
  var L = [['caa', 'Santé, prévoyance'], ['amundi', 'Épargne, retraite'], ['worklife', 'Avantages']];
  var h = L.filter(function(x){ return d.volets && d.volets[x[0]]; }).map(function(x){ return '<span class="ch ' + x[0] + '">' + x[1] + '</span>'; }).join('');
  return h || '<span class="sm">à préciser</span>';
}
function mini(st){ var o = Object.keys(ST.ref.statuts), i = o.indexOf(st); return '<div class="mini" aria-hidden="true">' + o.map(function(x, k){ return '<i class="' + (k < i || st === 'cloture' ? 'ok' : (k === i ? 'now' : '')) + '"></i>'; }).join('') + '</div>'; }
function marquerSel(){ [].forEach.call(document.querySelectorAll('.tbl tbody tr'), function(tr){ tr.setAttribute('aria-selected', String(+tr.getAttribute('data-id') === ST.sel)); }); }

/* ---------- fiche dossier ---------- */
function renderFiche(){
  var el = document.getElementById('fiche'); if (!el) return;
  var F = ST.fiche;
  if (!F || !F.dossier || F.dossier.id !== ST.sel) { el.innerHTML = '<div class="empty">' + (ST.liste.length ? 'Sélectionnez un dossier.' : 'Aucun dossier à afficher.') + '</div>'; return; }
  var d = F.dossier, clos = d.statut === 'cloture', ordre = Object.keys(ST.ref.statuts), ci = ordre.indexOf(d.statut);
  var canal = d.canal === 'solead' ? 'Reçu via SOLEAD' : (d.canal === 'crm' ? 'Poussé dans le CRM · alerte PUC' : 'Reçu dans le cockpit');
  var chips = '<div class="chips">' + (d.effectif ? '<span class="chip o">' + d.effectif + ' salariés</span>' : '') +
    '<span class="chip ' + d.niveau + '">' + esc(nv(d.niveau)) + ' · ' + esc(d.niveau === 'abandonniste' ? 'J+1 / J+7' : (d.niveau === 'chaud' && !d.rappel ? '48 h' : '24 h')) + '</span>' +
    '<span class="chip">' + esc(lib('client', d.client_statut)) + (d.portefeuille ? ' · ' + esc(d.portefeuille) : '') + '</span>' +
    '<span class="chip src">' + esc(canal) + '</span><span class="chip o">Scénario ' + esc(d.scenario) + '</span>' +
    (d.marche ? '<span class="chip o">' + esc(lib('marches', d.marche)) + '</span>' : '') + (d.rappel ? '<span class="chip o">Rappel demandé</span>' : '') + '</div>';
  var jal = {}; (F.journal || []).forEach(function(){});
  var jl = d.jalons || {};
  var steps = '<div class="flow6" aria-label="Statut du dossier">' + ordre.map(function(s, i){
    var cls = (i < ci || (clos && i === ci)) ? 'ok' : (i === ci ? 'now' : '');
    return '<div class="' + cls + '">' + esc(ST.ref.statuts[s]) + (i === ci && clos && d.issue ? '<small>' + esc(lib('issues', d.issue)) + '</small>' : (jl[s] && i <= ci ? '<small>' + dt(jl[s], false) + '</small>' : '')) + '</div>'; }).join('') + '</div>';
  var acts = '';
  if (!FIL()) {
    if (clos) acts = '<div class="acts"><button class="btn p" data-act="rouvrir">Rouvrir le dossier</button><button class="btn" data-act="note">Ajouter une note</button>' + (NAT() ? '<button class="btn d" data-act="supprimer">Supprimer (RGPD)</button>' : '') + '</div>';
    else {
      var pec = ['depose', 'attribue'].indexOf(d.statut) >= 0;
      acts = '<div class="acts">' + (pec ? '<button class="btn p" data-act="prendre_en_charge">Prendre en charge</button>' : '') +
        '<button class="btn' + (pec ? '' : ' p') + '" data-act="appel">Appeler' + (d.telephone ? ' · ' + esc(d.telephone) : '') + '</button><button class="btn" data-act="rdv">Planifier un RDV</button>' +
        '<span class="menu"><button class="btn" id="plus" aria-expanded="' + ST.menu + '">Plus ▾</button>' + (ST.menu ? '<div class="lst" role="menu">' +
          '<button data-act="qualifier">Qualifier le besoin</button>' + (d.marche !== 'entreprise' ? '<button data-act="confier_pro">Confier à un conseiller pro</button>' : '') +
          '<button data-act="proposer">Marquer « Proposé »</button><button data-act="cloturer">Clôturer…</button><hr>' +
          '<button data-act="note">Ajouter une note</button><button data-act="attribuer">' + (NAT() ? 'Attribuer / transférer…' : 'Réattribuer dans ma CR…') + '</button>' +
          (d.email ? '<button data-act="email">Envoyer un e-mail au dirigeant…</button>' : '') + (d.consent_relance && d.prochaine_relance ? '<button data-act="stop_relances">Arrêter les relances automatiques</button>' : '') +
          (NAT() ? '<hr><button data-act="niveau">Corriger le niveau du lead…</button><button data-act="router">Relancer le routage</button><button data-act="supprimer">Supprimer (RGPD)…</button>' : '') +
          '</div>' : '') + '</span></div>';
    }
  }
  var vol = Object.keys(ST.ref.filiales).filter(function(f){ return d.volets && d.volets[f]; }).map(function(f){
    var v = d.volets[f], def = ST.ref.filiales[f], peut = !clos && (!FIL() || ST.user.filiale === f);
    var sel = peut ? '<select data-volet="' + f + '" aria-label="Statut du volet ' + esc(def.lib) + '">' + Object.keys(ST.ref.volet_statuts).map(function(s){ return '<option value="' + s + '"' + (v.statut === s ? ' selected' : '') + '>' + esc(ST.ref.volet_statuts[s]) + '</option>'; }).join('') + '</select>'
      : '<span class="st">' + esc(lib('volet_statuts', v.statut)) + '</span>';
    return '<div class="pb ' + f + '"><div class="ph">' + esc(def.lib) + ' <small>' + esc(def.outil) + '</small>' + (peut ? sel : '<span class="bd ' + (v.statut === 'signe' ? 'cloture' : (v.statut === 'propose' ? 'propose' : 'attribue')) + '">' + esc(lib('volet_statuts', v.statut)) + '</span>') + '</div>' + (v.note ? '<div class="pc">' + esc(v.note) + '</div>' : '') + '</div>';
  }).join('');
  var tabs = [['dossier', 'Dossier'], ['donnees', 'Données transmises'], ['parcours', 'Parcours (' + (F.leads || []).length + ')'], ['journal', 'Journal'], ['emails', 'E-mails (' + (F.emails || []).length + ')']];
  el.innerHTML = '<div class="ref">' + esc(d.reference) + ' · déposé le ' + dt(d.cree_le) + (d.version ? ' · version ' + esc(d.version) : '') + '</div>' +
    '<h3 class="nom">' + esc(d.raison_sociale || 'Entreprise non renseignée') + '</h3>' + chips + steps + acts +
    (d.synthese ? '<div class="syn"><b>Synthèse :</b> ' + esc(d.synthese) + '</div>' : '') +

function lier(){
  var q = function(s){ return document.querySelectorAll(s); };
  var b = document.getElementById('sortir'); if (b) b.onclick = function(){ api('deconnexion', {}, {}).then(function(){ ST.user = null; ST.fiche = null; ST.sel = null; hist(); boot(); }); };
  [].forEach.call(q('[data-vue]'), function(x){ x.onclick = function(){ ST.vue = x.getAttribute('data-vue'); hist(ST.vue === 'file' ? '#' : '#v=' + ST.vue); charger(); }; });
  var p = document.getElementById('persp'); if (p) p.onchange = function(){ ST.persp = p.value; ST.sel = null; ST.vue = 'file'; charger(); };
  [].forEach.call(q('[data-kf]'), function(x){ x.onclick = function(){ var kv = x.getAttribute('data-kf').split(':'); var on = ST.f[kv[0]] === kv[1]; delete ST.f.niveau; delete ST.f.sla; if (ST.f.statut === 'depose') delete ST.f.statut; if (!on) ST.f[kv[0]] = kv[1]; ST.sel = null; chargerFile(); }; });
  [].forEach.call(q('[data-f]'), function(x){ x.onchange = function(){ ST.f[x.getAttribute('data-f')] = x.value; ST.sel = null; chargerFile(); }; });
  [].forEach.call(q('[data-vf]'), function(x){ x.onclick = function(){ ST.f.vue = x.getAttribute('data-vf'); ST.sel = null; chargerFile(); }; });
  var fq = document.getElementById('fq'), tq; if (fq) fq.oninput = function(){ clearTimeout(tq); tq = setTimeout(function(){ ST.f.q = fq.value.trim(); ST.sel = null; chargerFile().then(function(){ var n = document.getElementById('fq'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }); }, 350); };
  var fm = document.getElementById('fmoi'); if (fm) fm.onchange = function(){ ST.f.moi = fm.checked ? '1' : ''; ST.sel = null; chargerFile(); };
  var fr = document.getElementById('freset'); if (fr) fr.onclick = function(){ ST.f = { vue:'actifs' }; ST.sel = null; chargerFile(); };
  var fx = document.getElementById('fexport'); if (fx && ST.demo) fx.onclick = function(e){ e.preventDefault(); window.LM_DEMO.exporter(); };
  [].forEach.call(q('.tbl tbody tr[data-id]'), function(tr){ tr.onclick = function(){ ST.menu = false; chargerFiche(+tr.getAttribute('data-id')); }; });
  [].forEach.call(q('[data-go]'), function(a){ a.onclick = function(e){ e.preventDefault(); ST.vue = 'file'; ST.sel = +a.getAttribute('data-go'); ST.f = { vue:'tous' }; chargerFile(); }; });
  var so = document.getElementById('sok'); if (so) so.onclick = function(){ ST.du = document.getElementById('sdu').value; ST.au = document.getElementById('sau').value; ST.stats = null; charger(); };
  var stc = document.getElementById('staches'); if (stc) stc.onclick = function(){ api('taches', {}, {}).then(function(j){ if (j.ok) { var r = j.resultat || {}; toast('Tâches : ' + (r.integres || 0) + ' intégrés, ' + (r.relances || 0) + ' relances, ' + (r.reprises || 0) + ' reprises, ' + (r.alertes || 0) + ' alertes.'); ST.stats = null; charger(); } else toast(j.error); }); };
  [].forEach.call(q('[data-param]'), function(x){ x.onclick = function(){ ST.param = x.getAttribute('data-param'); chargerParam(); }; });
  [].forEach.call(q('[data-edit-cr]'), function(x){ x.onclick = function(){ editCr(x.getAttribute('data-edit-cr')); }; });
  [].forEach.call(q('[data-edit-user]'), function(x){ x.onclick = function(){ editUser(x.getAttribute('data-edit-user')); }; });
  [].forEach.call(q('[data-mdp]'), function(x){ x.onclick = function(){ api('user_mdp', {}, { id:+x.getAttribute('data-mdp') }).then(function(j){ if (j.ok) montrerMdp('ce compte', j.mdp); else toast(j.error); }); }; });
  [].forEach.call(q('[data-edit-client]'), function(x){ x.onclick = function(){ editClient(x.getAttribute('data-edit-client')); }; });
  [].forEach.call(q('[data-suppr-client]'), function(x){ x.onclick = function(){ if (confirm('Retirer ce client de la base de démonstration ?')) api('client_suppr', {}, { siren:x.getAttribute('data-suppr-client') }).then(function(){ chargerParam(); }); }; });
  var dc = document.getElementById('democomptes'); if (dc) dc.onclick = function(){ api('demo_comptes', {}, {}).then(function(j){ if (!j.ok) return toast(j.error);
    modale('Comptes de démonstration', '<p style="margin:0">Mots de passe affichés une seule fois.</p><table class="mx" style="margin-top:8px"><tr><th>Identifiant</th><th>Nom</th><th>Mot de passe</th></tr>' + j.comptes.map(function(c){ return '<tr><td>' + esc(c.login) + '</td><td>' + esc(c.nom) + '</td><td>' + (c.mdp ? '<code>' + esc(c.mdp) + '</code>' : 'existe déjà') + '</td></tr>'; }).join('') + '</table>', function(){ return { ok:true }; }, 'J’ai noté les mots de passe'); chargerParam(); }); };
}
function lierFiche(){
  var el = document.getElementById('fiche'); if (!el) return;
  [].forEach.call(el.querySelectorAll('[data-act]'), function(b){ b.onclick = function(){ action(b.getAttribute('data-act')); }; });
  var pl = document.getElementById('plus'); if (pl) pl.onclick = function(e){ e.stopPropagation(); ST.menu = !ST.menu; renderFiche(); };
  [].forEach.call(el.querySelectorAll('[data-tab]'), function(b){ b.onclick = function(){ ST.onglet = b.getAttribute('data-tab'); renderFiche(); }; });
  [].forEach.call(el.querySelectorAll('[data-volet]'), function(s){ s.onchange = function(){ var f = s.getAttribute('data-volet');
    modale('Volet ' + ST.ref.filiales[f].lib + ' : ' + ST.ref.volet_statuts[s.value], NOTE, function(v){ return agir('volet', { filiale:f, statut:s.value, note:v.note }); }).querySelector('[data-x]').addEventListener('click', function(){ renderFiche(); }); }; });
}
document.addEventListener('click', function(e){ if (ST.menu && !(e.target.closest && e.target.closest('.menu'))) { ST.menu = false; renderFiche(); } });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { var o = document.querySelector('.ov'); if (o) o.remove(); else if (ST.menu) { ST.menu = false; renderFiche(); } } });

/* ---------- démonstration : cockpit-brh.html?demo=1 (ou fichier ouvert en local) ---------- */
window.LM_APP = { ST:ST, boot:boot, render:render, action:action, chargerFiche:chargerFiche };
var demo = /[?&]demo=1\b/.test(location.search) || location.protocol === 'file:';
if (window.LM_DEMO) { ST.demo = true; boot(); }
else if (demo) { var s = document.createElement('script'); s.src = 'cockpit-brh-demo.js?v=20261114'; s.onload = function(){ ST.demo = true; boot(); }; s.onerror = function(){ app.innerHTML = '<main><p class="err">Données de démonstration introuvables (cockpit-brh-demo.js).</p></main>'; }; document.head.appendChild(s); }
else boot();
})();
</script>
