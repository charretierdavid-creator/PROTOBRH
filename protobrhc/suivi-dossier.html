<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Suivi de votre dossier — Banque des Ressources Humaines</title>
<!-- Suivi du Dossier BRH par le dirigeant (version C) : lien reçu par e-mail ou en fin de devis.
     Mêmes 6 statuts que le cockpit de l'expert ; jamais le niveau du lead ni le statut client.
     Données : lm-suivi.php. Démonstration : suivi-dossier.html?demo=1 -->
<style>
:root{--green:#065145;--teal:#016265;--lime:#8FB822;--mint:#E3EFEA;--mint-2:#F2F7F5;--ink:#1d2b28;--slate:#5b6b66;--line:#dfe6e2;--fh:"Avenir Next Condensed","Avenir Next","Segoe UI",system-ui,sans-serif;--fb:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#F6F9F8;color:var(--ink);font:15px/1.5 var(--fb)}
header{background:var(--green);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
header b{font:700 1.1rem var(--fh)}header span{opacity:.8;font-size:.85rem}
main{max-width:860px;margin:0 auto;padding:26px 20px 60px}
h1{font:700 1.6rem var(--fh);color:var(--green);margin:0 0 4px}
.ref{color:var(--slate);font-size:.88rem;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(6,81,69,.05)}
.msg{background:var(--mint-2);border-left:0;border-radius:12px;padding:12px 16px;font-weight:600;color:var(--green)}
.frise{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:18px 0 6px;position:relative}
.frise div{text-align:center;position:relative;font-size:.78rem;color:var(--slate);padding-top:30px}
.frise div::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--line);z-index:1}
.frise div::after{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line)}
.frise div:first-child::after{display:none}
.frise div.ok{color:var(--green);font-weight:700}.frise div.ok::before{background:var(--green);border-color:var(--green)}.frise div.ok::after{background:var(--green)}
.frise div.cur::before{background:var(--lime);border-color:var(--lime);box-shadow:0 0 0 4px rgba(143,184,34,.25)}
.frise small{display:block;font-weight:400;font-size:.7rem;color:var(--slate)}
@media(max-width:620px){.frise{grid-template-columns:1fr;gap:8px}.frise div{text-align:left;padding:0 0 0 30px}.frise div::before{left:8px;top:2px}.frise div::after{display:none}}
dl{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;margin:0}dt{color:var(--slate)}dd{margin:0}
@media(max-width:620px){dl{grid-template-columns:1fr}}
h2{font:700 1.05rem var(--fh);color:var(--green);margin:0 0 10px}
.btn{display:inline-block;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;text-decoration:none;cursor:pointer;font-size:.9rem}
.btn.o{background:#fff;color:var(--green)}
form{display:grid;gap:10px;max-width:460px}input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
label.ck{display:flex;gap:8px;font-size:.84rem;color:var(--slate)}
.err{color:#b3261e;font-size:.88rem}.note{color:var(--slate);font-size:.82rem}
.res{white-space:pre-line;background:var(--mint-2);border-radius:10px;padding:10px 14px}
.demo{background:#EEF0FF;color:#2F3A8F;padding:6px 24px;font-size:.8rem}
</style>
</head>
<body>
<header><b>Banque des Ressources Humaines</b><span>Suivi de votre dossier</span></header>
<div id="demo" class="demo" hidden>Démonstration : dossier fictif, aucune donnée enregistrée.</div>
<main id="app"><p class="note">Chargement de votre dossier…</p></main>
<script>
(function(){
  'use strict';
  var qp = new URLSearchParams(location.search), app = document.getElementById('app');
  var DEMO = qp.get('demo') === '1' || location.protocol === 'file:';
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };
  var dt = function(s){ if (!s) return ''; var d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? '' : d.toLocaleDateString('fr-FR', { day:'numeric', month:'long' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }).replace(':', ' h '); };
  function exemple(){ var t = Date.now(), i = function(h){ return new Date(t - h * 36e5).toISOString().slice(0, 16).replace('T', ' '); };
    return { ok:true, dossier:{ reference:'BRH-26-004801', cree_le:i(20), raison_sociale:'Boulangerie Lemoine SAS', prenom:'Claire', statut:'pris_en_charge', statut_lib:'Pris en charge', issue:null,
      etapes:[['depose', 'Déposé', i(20)], ['attribue', 'Attribué', i(20)], ['pris_en_charge', 'Pris en charge', i(2)], ['qualifie', 'Qualifié'], ['propose', 'Proposé'], ['cloture', 'Clôturé']].map(function(e){ return { code:e[0], lib:e[1], date:e[2] || null, courant:e[0] === 'pris_en_charge' }; }),
      caisse:'Crédit Agricole Touraine Poitou', interlocuteur:{ nom:'J. Marchand', role:'Expert Banque des Ressources Humaines' }, rdv_le:null,
      solutions:['Santé & prévoyance', 'Épargne salariale', 'Avantages salariés'], volets:[{ lib:'CA Assurances', statut:'En attente de qualification' }, { lib:'Amundi / CA Titres', statut:'En attente de qualification' }, { lib:'Worklife', statut:'Proposition envoyée' }],
      message:'Votre expert vous rappelle pour finaliser votre devis.', resultat:null, peut_rappel:false, relances:true, reprise:null } }; }
  function api(body){
    if (DEMO) return Promise.resolve(body ? { ok:true, message:body.action === 'stop' ? 'C’est noté : vous ne recevrez plus de relances.' : 'Merci. Un expert vous rappelle dans les 48 heures ouvrées.' } : exemple());
    var p = { d:qp.get('d') || '', j:qp.get('j') || '' };
    return fetch('lm-suivi.php' + (body ? '' : '?' + new URLSearchParams(p)), body ? { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(Object.assign(p, body)) } : {})
      .then(function(r){ return r.json(); }).catch(function(){ return { ok:false, error:'Service momentanément indisponible.' }; });
  }
  function rendre(j){
    if (!j.ok) { app.innerHTML = '<h1>Suivi de votre dossier</h1><div class="card"><p class="err">' + esc(j.error) + '</p><p><a class="btn o" href="index.html">Revenir au portail</a></p></div>'; return; }
    var d = j.dossier, ci = d.etapes.map(function(e){ return e.code; }).indexOf(d.statut);
    var frise = '<div class="frise" aria-label="Avancement de votre dossier">' + d.etapes.map(function(e, i){ return '<div class="' + (i <= ci ? 'ok' : '') + (i === ci ? ' cur' : '') + '">' + esc(e.lib) + (e.date && i <= ci ? '<small>' + esc(dt(e.date)) + '</small>' : '') + '</div>'; }).join('') + '</div>';
    var info = [['Votre interlocuteur', d.interlocuteur ? esc(d.interlocuteur.nom) + ' · ' + esc(d.interlocuteur.role) : 'en cours de désignation par votre Caisse régionale'], ['Caisse régionale', esc(d.caisse || 'en cours de désignation')],
      ['Rendez-vous', d.rdv_le ? esc(dt(d.rdv_le)) : ''], ['Solutions étudiées', esc(d.solutions.join(', '))]].filter(function(r){ return r[1]; });
    app.innerHTML = '<h1>Bonjour' + (d.prenom ? ' ' + esc(d.prenom) : '') + '</h1><p class="ref">Dossier ' + esc(d.reference) + (d.raison_sociale ? ' · ' + esc(d.raison_sociale) : '') + ' · déposé le ' + esc(dt(d.cree_le)) + '</p>' +
      '<div class="card"><p class="msg">' + esc(d.message) + '</p>' + frise + (d.issue ? '<p class="note">Issue : ' + esc(d.issue) + '</p>' : '') + '</div>' +
      '<div class="card"><h2>Votre dossier</h2><dl>' + info.map(function(r){ return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('') + '</dl>' +
      (d.volets.length ? '<h2 style="margin-top:16px">Avancement par solution</h2><dl>' + d.volets.map(function(v){ return '<dt>' + esc(v.lib) + '</dt><dd>' + esc(v.statut) + '</dd>'; }).join('') + '</dl>' : '') + '</div>' +
      (d.resultat ? '<div class="card"><h2>Le résultat de votre simulation</h2><p class="res">' + esc(d.resultat) + '</p></div>' : '') +
      (d.reprise || d.peut_rappel ? '<div class="card"><h2>Et maintenant ?</h2>' + (d.reprise ? '<p><a class="btn" href="' + esc(d.reprise) + '">' + (d.reprise === 'devis.html' ? 'Reprendre mon devis' : 'Retrouver ma simulation') + '</a> <a class="btn o" href="devis.html">Obtenir mon devis en ligne</a></p>' : '') +
        (d.peut_rappel ? '<form id="frap"><b>Être rappelé par un expert</b><input name="telephone" type="tel" placeholder="Votre téléphone" autocomplete="tel" required><select name="creneau"><option value="">Créneau indifférent</option><option>Le matin</option><option>L’après-midi</option></select><label class="ck"><input type="checkbox" name="consentement" required> J’accepte d’être rappelé par un expert Banque des Ressources Humaines du Crédit Agricole au sujet de ma demande.</label><p class="err" id="rerr"></p><button class="btn" type="submit">Être rappelé</button></form>' : '') + '</div>' : '') +
      (d.relances ? '<p class="note">Vous recevez des e-mails de suivi au sujet de cette demande. <a href="#" id="stop">Ne plus recevoir de relances</a></p>' : '<p class="note">Vous ne recevez plus de relances au sujet de cette demande.</p>') +
      '<p class="note">Vos données sont utilisées par le Crédit Agricole et votre Caisse régionale pour traiter votre demande, et conservées 12 mois.</p>';
    var f = document.getElementById('frap');
    if (f) f.onsubmit = function(e){ e.preventDefault(); api({ action:'rappel', telephone:f.telephone.value, creneau:f.creneau.value, consentement:f.consentement.checked }).then(function(r){ if (!r.ok) { document.getElementById('rerr').textContent = r.error; return; } f.outerHTML = '<p class="msg">' + esc(r.message) + '</p>'; }); };
    var s = document.getElementById('stop');
    if (s) s.onclick = function(e){ e.preventDefault(); api({ action:'stop' }).then(function(r){ s.parentNode.textContent = r.ok ? r.message : r.error; }); };
    /* lien « ne plus recevoir ces messages » des e-mails : confirmation en un clic */
    if (qp.get('stop') === '1' && d.relances && s) {
      var c = document.createElement('div'); c.className = 'card'; c.innerHTML = '<h2>Ne plus recevoir de relances ?</h2><p>Votre dossier reste ouvert et consultable ici ; seuls les e-mails de relance s’arrêtent.</p><button class="btn" type="button">Confirmer</button>';
      app.insertBefore(c, app.children[2]); c.querySelector('button').onclick = function(){ s.click(); c.innerHTML = '<p class="msg">C’est noté : vous ne recevrez plus de relances.</p>'; };
    }
  }
  if (DEMO) document.getElementById('demo').hidden = false;
  if (!DEMO && (!qp.get('d') || !qp.get('j'))) rendre({ ok:false, error:'Lien de suivi incomplet : utilisez le lien reçu par e-mail.' });
  else api(null).then(rendre);
})();
</script>
</body>
</html>
