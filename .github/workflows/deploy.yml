name: Mise en ligne Hostinger
on:
  workflow_dispatch:
jobs:
  verif-acces:
    runs-on: ubuntu-latest
    steps:
      - name: Vérification de la porte d'accès en ligne (sans identifiants)
        run: |
          for u in https://protobrh.monsitedetest.com/ https://protobrh.monsitedetest.com/diagnostic.html https://protobrh.monsitedetest.com/connaissances.txt https://protobrh.monsitedetest.com/config.php https://protobrh.monsitedetest.com/photo.jpeg https://cdcbrh.monsitedetest.com/ https://cdcbrh.monsitedetest.com/journal.json "https://cdcbrh.monsitedetest.com/comments.php?action=list" https://cdcbrh.monsitedetest.com/config.php; do
            code=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 20 "$u")
            t=$(grep -o "<title>[^<]*" /tmp/b | head -1 | sed 's/<title>//'); [ -z "$t" ] && t=$(head -c 70 /tmp/b | tr -d '\n' | tr -c '[:print:]' '?')
            echo "$code  $u  ->  $t"
          done
