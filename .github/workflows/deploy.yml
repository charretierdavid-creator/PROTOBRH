name: Mise en ligne Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Chaque site a son propre compte FTP (hPanel > monsitedetest.com > Comptes FTP),
# dont la racine est directement le dossier servi : public_html/cdcbrh ou public_html/protobrh.
# Les fichiers absents du dépôt (config.php, data/, .htaccess) ne sont jamais supprimés.
jobs:
  cdcbrh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envoi de cdcbrh/ vers cdcbrh.monsitedetest.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.monsitedetest.com
          username: ${{ secrets.CDCBRH_FTP_USERNAME }}
          password: ${{ secrets.CDCBRH_FTP_PASSWORD }}
          local-dir: ./cdcbrh/
          server-dir: ./

  protobrh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envoi de protobrh/ vers protobrh.monsitedetest.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.monsitedetest.com
          username: ${{ secrets.PROTOBRH_FTP_USERNAME }}
          password: ${{ secrets.PROTOBRH_FTP_PASSWORD }}
          local-dir: ./protobrh/
          server-dir: ./

  # Test A/B : versions A et B = socle protobrh/ + fichiers propres (protobrha/, protobrhb/),
  # assemblés par outils/assembler_variantes.py. Tant que les secrets FTP d'une version
  # n'existent pas dans GitHub, sa mise en ligne est simplement ignorée.
  protobrha:
    runs-on: ubuntu-latest
    env:
      FTP_USER: ${{ secrets.PROTOBRHA_FTP_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        if: env.FTP_USER != ''
      - name: Assemblage de la version A
        if: env.FTP_USER != ''
        run: python3 outils/assembler_variantes.py a
      - name: Envoi de la version A vers protobrha.monsitedetest.com
        if: env.FTP_USER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.monsitedetest.com
          username: ${{ secrets.PROTOBRHA_FTP_USERNAME }}
          password: ${{ secrets.PROTOBRHA_FTP_PASSWORD }}
          local-dir: ./_site/protobrha/
          server-dir: ./
      - name: Version A non configurée
        if: env.FTP_USER == ''
        run: echo 'Secrets PROTOBRHA_FTP_USERNAME et PROTOBRHA_FTP_PASSWORD absents, mise en ligne de la version A ignorée.'

  protobrhb:
    runs-on: ubuntu-latest
    env:
      FTP_USER: ${{ secrets.PROTOBRHB_FTP_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        if: env.FTP_USER != ''
      - name: Assemblage de la version B
        if: env.FTP_USER != ''
        run: python3 outils/assembler_variantes.py b
      - name: Envoi de la version B vers protobrhb.monsitedetest.com
        if: env.FTP_USER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.monsitedetest.com
          username: ${{ secrets.PROTOBRHB_FTP_USERNAME }}
          password: ${{ secrets.PROTOBRHB_FTP_PASSWORD }}
          local-dir: ./_site/protobrhb/
          server-dir: ./
      - name: Version B non configurée
        if: env.FTP_USER == ''
        run: echo 'Secrets PROTOBRHB_FTP_USERNAME et PROTOBRHB_FTP_PASSWORD absents, mise en ligne de la version B ignorée.'
