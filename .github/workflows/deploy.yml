name: Test FTP upload to cdcbrh

on:
  workflow_dispatch:
  push:
    branches:
      - Main
    paths:
      - github-deploy-test.txt

permissions:
  contents: read

jobs:
  upload-test-file:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Upload only the test file to cdcbrh
        if: hashFiles('github-deploy-test.txt') != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.CDCBRH_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.CDCBRH_FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          curl --show-error --silent --ftp-pasv \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file ./github-deploy-test.txt \
            "ftp://${FTP_SERVER}:21/github-deploy-test.txt"
