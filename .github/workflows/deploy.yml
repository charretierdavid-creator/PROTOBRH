name: Mise en ligne Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cdcbrh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envoi de cdcbrh/ vers cdcbrh.monsitedetest.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./cdcbrh/
          server-dir: ${{ secrets.CDCBRH_DIR }}

  protobrh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envoi de protobrh/ vers protobrh.monsitedetest.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./protobrh/
          server-dir: ${{ secrets.PROTOBRH_DIR }}
