name: Mise en ligne Hostinger

on:
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [CDCBRH, PROTOBRH]
    steps:
      - name: Contenu de public_html (lecture seule)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets[format('{0}_FTP_USERNAME', matrix.site)] }}
          P: ${{ secrets[format('{0}_FTP_PASSWORD', matrix.site)] }}
        run: |
          H="$(printf '%s' "$S" | tr -d '[:space:]')"; H="${H#*://}"; H="${H%%/*}"; H="${H%%:*}"
          echo "::add-mask::$H"
          [ -n "$U" ] || { echo "SECRET ${{ matrix.site }}_FTP_USERNAME ABSENT"; exit 1; }
          site=$(echo "${{ matrix.site }}" | tr A-Z a-z)
          [ "$U" = "u631589815.$site.monsitedetest.com" ] && echo "utilisateur: conforme" || echo "utilisateur: DIFFERENT de u631589815.$site.monsitedetest.com (longueur ${#U})"
          echo "mot de passe: longueur ${#P}"
          case "$P" in " "*|*" ") echo "mot de passe: ESPACE au debut ou a la fin";; esac
          case "$P" in *$'\n'*|*$'\r'*) echo "mot de passe: RETOUR A LA LIGNE";; esac
          for d in "" "public_html/"; do
            echo "== /$d"
            curl -sS --max-time 20 -u "$U:$P" "ftp://$H/$d" | tr -d '\r' | awk '{print $5, $6, $7, $8, $9}'
          done
