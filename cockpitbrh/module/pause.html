<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Prototype temporairement suspendu — Banque des RH</title>
<!-- Page affichée pendant une pause du site (bloc « PAUSE-DPO: on » du .htaccess). Autonome : aucun fichier externe, aucun script. -->
<style>
:root{--g:#065145;--l:#8FB822;--ink:#1d2b28;--sl:#5c6b64;--bg:#f4f7f5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
main{max-width:560px;background:#fff;border:1px solid #dfe6e2;border-radius:20px;padding:36px 32px;text-align:center}
.logo{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--l);color:var(--g);font-weight:800;font-size:14px;margin-bottom:18px}
h1{font-size:1.45rem;line-height:1.25;color:var(--g);margin:0 0 12px}
p{margin:0 0 12px;color:var(--sl)}
</style>
</head>
<body>
<main>
<div class="logo" aria-hidden="true">BRH</div>
<h1>Ce prototype est temporairement suspendu</h1>
<p>Le prototype exploratoire Banque des RH est fermé pour le moment. Aucune information n'est recueillie pendant cette pause.</p>
<p>Pour toute question, contactez l'équipe projet Banque des RH.</p>
</main>
</body>
</html>
