<!DOCTYPE html>
<!-- Module LM 3.0.2 — 17/11/2026 · console simplifiée de l'expert BRH, de l'expert BRH Pro et du conseiller Pro, en démonstration (données fictives), graphisme de la console d'origine · historique : VERSIONS.md -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<title>Cockpit BRH — console LM 3.0 (démonstration)</title>
<!-- ==========================================================================
     CONSOLE LM 3.0 — cahier des charges cdcbrh, pages P1 et P4. Graphisme repris de la console LM 2.0
     (console.html) : bandeau vert, onglets Poppins soulignés de lime, cadre ardoise, titres condensés, sections à intertitres.
     Démonstration sans serveur : données fictives (lm3-demo.js) gardées dans ce navigateur,
     règles de gestion dans lm3-regles.js, interface dans console3.js. Aucun e-mail n'est envoyé.
     Échelle unique : texte 14 px, secondaire 13 px, intertitres 12 px capitales, nom du lead 28 px condensé ;
     boutons, champs et listes déroulantes de 40 px de haut ; rayons 6 px (commandes, vignettes) et 10 px (cadres).
     ========================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<style>
:root{
  --green:#065145; --lime:#8fb822; --lime-soft:#c7dd8a; --ink:#233029; --slate:#5c6b64; --line:#e7ece9;
  --v-teal:#009597; --v-deep:#004A4B; --v-slate:#344C4D; --v-mist:#E2ECE8; --v-mist2:#F1F6F4; --v-grey:#66706A; --v-line:#C9D8D3; --v-sel:#E6F4F4;
  --devis:#B42318; --devis-s:#FBE7E5; --simu:#00696B; --simu-s:#E2F1F0; --rappel:#8A5D0E; --rappel-s:#FBF1DE;
  --late:#7A1F2B; --ok:#1E6B3A;
  --fh:'Poppins',"Avenir Next","Segoe UI",system-ui,sans-serif; --fb:'Inter',"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  --cond:"Avenir Next Condensed","Barlow Condensed","Arial Narrow","Segoe UI",sans-serif;
  --h:40px; --r:6px; --R:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:14px/21px var(--fb);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--v-teal)} a:hover{color:var(--v-deep)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:var(--r)}
.hidden{display:none!important}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
/* bandeau du portail */
.pbar{background:var(--green);color:#fff}
.pbar .wrap{display:flex;align-items:center;gap:8px 16px;min-height:52px;flex-wrap:wrap}
.pbar b{font-family:var(--fh);letter-spacing:.03em;font-size:15px} .pbar b i{font-style:normal;color:var(--lime-soft)}
.pbar .s{font-size:13px;opacity:.85}
nav.tabs{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 16px 10px;font-family:var(--fh);font-weight:500;font-size:14px;color:var(--slate);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--green);border-bottom-color:var(--lime);font-weight:600}
/* barre de démonstration */
.demo{background:#FBF1DE;color:#6B4D00;border-bottom:1px solid #EED7AE;font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-top:8px;padding-bottom:8px}
.demo b{font-weight:700}
.demo label{display:flex;align-items:center;gap:8px;font-weight:600}
.demo .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
main{padding:20px 0 60px}
/* commandes : une seule hauteur */
.btn,select,input[type=search],input[type=text],input[type=date],input[type=tel]{height:var(--h);border-radius:var(--r);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1.5px solid var(--v-line);background:#fff;color:var(--v-deep);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1}
.btn:hover{background:var(--v-mist2)}
.btn.p{background:var(--v-deep);border-color:var(--v-deep);color:#fff} .btn.p:hover{background:#00393A}
.btn.s{border-color:var(--v-deep);color:var(--v-deep)}
.btn.ia{border-color:#B9D9D9;color:var(--v-teal)}
.btn.d{border-color:#E4C4BF;color:#9A3B2E}
.btn.l{border:0;background:none;padding:0 4px;height:auto;color:var(--v-teal);text-decoration:underline;font-weight:600}
.btn[aria-pressed="true"]{background:var(--v-deep);border-color:var(--v-deep);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.w{flex:1 1 220px}
.btn svg{width:16px;height:16px;flex:none}
select,input[type=search],input[type=text],input[type=date],input[type=tel]{border:1.5px solid var(--v-line);background:#fff;padding:0 12px;color:var(--v-slate);min-width:0}
textarea{border:1.5px solid var(--v-line);border-radius:var(--r);background:#fff;padding:9px 12px;font-size:14px;line-height:21px;color:var(--v-slate);min-height:84px;resize:vertical;width:100%}
.demo select{max-width:320px}
/* cadre de la console */
.cx{border:1px solid #BFCFCA;border-radius:var(--R);overflow:hidden;background:#fff;color:var(--v-slate)}
.ctop{display:flex;align-items:center;gap:8px 16px;background:var(--v-slate);color:#fff;padding:12px 20px;flex-wrap:wrap}
.ctop h1{margin:0;font:700 20px/24px var(--cond);letter-spacing:.01em}
.ctop .r{margin-left:auto;font-size:13px;opacity:.92}
.sig{display:inline-block;font:700 11px/1 var(--fb);letter-spacing:.04em;padding:4px 6px;border-radius:4px;margin-left:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;vertical-align:2px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--v-line)}
.kp div{border-right:1px solid var(--v-line);padding:12px 20px;color:var(--v-grey);font-size:13px;line-height:18px}
.kp div:last-child{border-right:0}
.kp b{display:block;font:700 28px/1.1 var(--cond);margin-bottom:2px}
.kp .devis b{color:var(--devis)} .kp .simulation b{color:var(--simu)} .kp .rappel b{color:var(--rappel)}
.filters{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-bottom:1px solid var(--v-line);background:var(--v-mist2)}
.filters input[type=search]{flex:1 1 240px;max-width:380px}
.seg{display:inline-flex;border:1.5px solid var(--v-line);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{border:0;background:none;height:calc(var(--h) - 3px);padding:0 16px;font-size:14px;font-weight:500;cursor:pointer;color:var(--v-slate)}
.seg button+button{border-left:1px solid var(--v-line)}
.seg button[aria-pressed="true"]{background:var(--v-deep);color:#fff;font-weight:600}
.split{display:grid;grid-template-columns:minmax(520px,1fr) minmax(0,1.05fr)}
@media(max-width:1150px){.split{grid-template-columns:1fr}.ls{border-right:0!important;border-bottom:1px solid var(--v-line)}}
.ls{border-right:1px solid var(--v-line);min-width:0}
/* liste */
.lg{display:grid;grid-template-columns:96px minmax(0,1fr) 128px;column-gap:14px}
.lh{padding:10px 20px;background:var(--v-mist2);border-bottom:1px solid var(--v-line);font-size:12px;line-height:16px;font-weight:600;color:var(--v-grey)}
.row{row-gap:4px;align-items:center;width:100%;padding:12px 20px;border:0;border-bottom:1px solid #EEF3F1;background:#fff;text-align:left;cursor:pointer;color:var(--v-slate)}
.row:hover{background:var(--v-mist2)}
.row[aria-current="true"]{background:var(--v-sel);box-shadow:inset 3px 0 0 var(--v-teal)}
.row .n{font-weight:700;color:var(--v-deep);line-height:20px}
.row .c2{font-size:13px;line-height:18px;color:var(--v-grey)}
.row .tags{display:flex;flex-wrap:wrap;gap:4px}
.empty{padding:32px 20px;text-align:center;color:var(--v-grey)}
/* vignettes : rectangle arrondi, deux tailles */
.vg{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--r);font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--v-line);background:#fff;color:var(--v-slate);line-height:1}
.vg.big{height:26px;padding:0 10px;font-size:13px}
.vg.devis{background:var(--devis-s);border-color:var(--devis-s);color:var(--devis)}
.vg.simu{background:var(--simu-s);border-color:var(--simu-s);color:var(--simu)}
.vg.rappel{background:var(--rappel-s);border-color:var(--rappel-s);color:var(--rappel)}
.vg.trans{background:var(--v-mist);border-color:var(--v-mist);color:var(--v-deep)}
.vg.seg{border-color:var(--v-deep);color:var(--v-deep)}
.vg.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.vg.late{background:var(--late);border-color:var(--late);color:#fff}
.vg.clos{background:var(--v-mist2);color:var(--v-grey)}
/* fiche */
.fiche{padding:20px 24px 28px;min-width:0;display:flex;flex-direction:column;gap:18px}
.ref{font-size:13px;line-height:18px;color:var(--v-grey)}
.fiche h2.nom{font:700 28px/32px var(--cond);color:var(--v-deep);margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sec h3{font:700 12px/16px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--v-grey);margin:0 0 10px;padding-top:16px;border-top:1px solid var(--v-line)}
.alert{border:1px solid var(--v-line);background:var(--v-mist2);color:var(--v-deep);border-radius:var(--R);padding:12px 16px}
.alert.warn{border-color:#EED7AE;background:#FBF1DE;color:#6B4D00}
.alert.e{border-color:#E4C4BF;background:#FBEDEB;color:#9A3B2E;font-weight:600}
.dec{border:1px solid var(--v-line);border-left:4px solid var(--lime);background:var(--v-mist2);border-radius:var(--R);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.dec h4{margin:0;font:600 16px/22px var(--fh);color:var(--v-deep)}
.dec .hint{margin:-6px 0 0;font-size:13px;line-height:19px;color:var(--v-grey)}
.dec .quote{margin:0;padding:10px 14px;background:#fff;border:1px solid var(--v-line);border-radius:var(--r);font-style:italic;color:var(--v-slate)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--v-slate)}
.frow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.frow .fld{flex:1 1 180px}
.opt{display:flex;gap:12px;align-items:center;min-height:52px;border:1.5px solid var(--v-line);border-radius:var(--r);padding:8px 12px;cursor:pointer;background:#fff}
.opt:hover{background:var(--v-mist2)} .opt:has(input:checked){border-color:var(--v-teal);background:#F3FAFA}
.opt input{width:18px;height:18px;accent-color:var(--v-deep);flex:none}
.opt b{color:var(--v-deep)} .opt small{display:block;font-size:13px;color:var(--v-grey)}
fieldset{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px}
legend{padding:0 0 6px;font-size:13px;font-weight:600;color:var(--v-slate)}
.prep{border:1px solid #B9D9D9;background:#F3FAFA;border-radius:var(--R);padding:14px 16px}
.prep ul{margin:8px 0 0;padding-left:18px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--v-grey)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts .end{margin-left:auto}
/* contact dans l'entreprise */
.contact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center}
.contact .who{font:600 16px/22px var(--fh);color:var(--v-deep)}
.contact .who small{font:400 13px var(--fb);color:var(--v-grey);margin-left:8px}
.contact .meta{font-size:13px;line-height:19px;color:var(--v-grey);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.contact .go{grid-row:1/3;grid-column:2;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:760px){.contact{grid-template-columns:1fr}.contact .go{grid-column:1;grid-row:auto;justify-content:flex-start}}
/* historique et e-mails */
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #EEF3F1}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--v-grey);font-size:13px;font-variant-numeric:tabular-nums}
.mails{display:flex;flex-direction:column}
.mails button{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 8px;border:0;border-bottom:1px solid #EEF3F1;background:none;text-align:left;cursor:pointer;color:var(--v-slate);border-radius:var(--r)}
.mails button:hover{background:var(--v-mist2)}
.mails time{color:var(--v-grey);font-size:13px}
.mails b{font-weight:600;color:var(--v-deep)}
.mails .open{font-size:13px;color:var(--v-teal);font-weight:600}
.small{font-size:13px;line-height:19px;color:var(--v-grey)}
/* annuaire */
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--v-grey);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--v-line);background:var(--v-mist2);font-size:12px}
td{padding:12px 14px;border-bottom:1px solid #EEF3F1;vertical-align:top}
td b{color:var(--v-deep)}
/* fenêtres flottantes */
.mask{position:fixed;inset:0;background:rgba(20,35,32,.42);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.dlg{background:#fff;border-radius:12px;max-width:680px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25);overflow:hidden}
.dlg .dh{display:flex;align-items:center;gap:12px;background:var(--v-slate);color:#fff;padding:12px 20px}
.dlg .dh h2{margin:0;font:700 19px/24px var(--cond)}
.dlg .dh button{margin-left:auto;background:none;border:0;color:#fff;font-size:24px;line-height:1;cursor:pointer;width:32px;height:32px;border-radius:var(--r)}
.dlg .db{padding:18px 20px;max-height:72vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg .df{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px;border-top:1px solid var(--v-line);background:var(--v-mist2);flex-wrap:wrap}
.dlg .df .small{margin-right:auto}
.mailbody{white-space:pre-wrap;margin:0;padding:16px;border:1px solid var(--v-line);border-radius:var(--r);background:#fff;font:14px/22px var(--fb);color:var(--ink)}
.script .bl{border-left:3px solid var(--v-teal);padding:2px 0 2px 12px}
.script .bl h5{margin:0 0 4px;font:600 14px var(--fh);color:var(--v-deep)}
.script .bl p{margin:2px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--v-deep);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:92vw}
#toast.e{background:#9A3B2E}
@media(max-width:700px){.wrap{padding:0 12px}.lg{grid-template-columns:76px minmax(0,1fr) 92px;column-gap:10px}.fiche{padding:18px 14px}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pbar"><div class="wrap"><b>PORTAIL BRH <i>15C</i></b><span class="s">Lead management de la Banque des RH · console LM 3.0</span></div></div>
<nav class="tabs" aria-label="Rubriques"><div class="wrap">
  <button type="button" data-a="onglet" data-v="leads" aria-current="page">Mes leads</button>
  <button type="button" data-a="onglet" data-v="annuaire">Annuaire pro et filiales</button>
</div></nav>
<div class="demo" role="region" aria-label="Démonstration"><div class="wrap">
  <span><b>Démonstration</b> · données fictives, rien n'est envoyé</span>
  <label for="persona">Se connecter en tant que <select id="persona"></select></label>
  <span class="sp">
    <button type="button" class="btn" id="b-simuler">Simuler une visite du portail</button>
    <button type="button" class="btn" id="b-reset">Réinitialiser la démonstration</button>
  </span>
</div></div>
<main class="wrap" id="app" aria-live="polite"></main>
<div id="fen"></div>
<div id="toast" class="hidden" role="status"></div>
<script src="lm3-regles.js?v=20261117b"></script>
<script src="lm3-demo.js?v=20261117b"></script>
<script src="console3.js?v=20261117b"></script>
</body>
</html>
